name: Harvest Log checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: harvest_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harvest_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/harvest_ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Prepare the disposable test environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Check schema, static assets, fixtures and test suite
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py seed_demo
          python manage.py test --verbosity 2
      - name: Rehearse manager and hand workflows in Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python manage.py test qa.browser --verbosity 2
